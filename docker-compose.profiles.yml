version: '3.8'

# Docker Compose with Maven Profiles Support
# Supports both JVM and Native execution modes

services:
  # Cassandra Database (shared by both profiles)
  cassandra:
    image: cassandra:5.0
    container_name: beauty-salon-cassandra-profiles
    hostname: cassandra
    environment:
      - CASSANDRA_CLUSTER_NAME=BeautySalonCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_NUM_TOKENS=128
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data_profiles:/var/lib/cassandra
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - beauty-salon-profiles
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Java Reactive Backend - JVM Profile
  api-jvm:
    build:
      context: ./backend/java-reactive
      dockerfile: Dockerfile.jvm
    image: beauty-salon-reactive:jvm
    container_name: beauty-salon-api-jvm
    hostname: api-jvm
    ports:
      - "8085:8085"
    environment:
      # Spring Boot Configuration
      - SPRING_PROFILES_ACTIVE=docker
      
      # Cassandra Configuration
      - SPRING_DATA_CASSANDRA_CONTACT_POINTS=cassandra
      - SPRING_DATA_CASSANDRA_PORT=9042
      - SPRING_DATA_CASSANDRA_KEYSPACE_NAME=beauty_salon
      - SPRING_DATA_CASSANDRA_LOCAL_DATACENTER=datacenter1
      - SPRING_DATA_CASSANDRA_SCHEMA_ACTION=CREATE_IF_NOT_EXISTS
      
      # Server Configuration
      - SERVER_PORT=8085
      - SERVER_COMPRESSION_ENABLED=true
      
      # JVM Options
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseG1GC
      
      # Logging
      - LOGGING_LEVEL_ROOT=INFO
      - LOGGING_LEVEL_COM_BEAUTYSALON=DEBUG
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - beauty-salon-profiles
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    profiles:
      - jvm

  # Java Reactive Backend - Native Profile
  api-native:
    build:
      context: ./backend/java-reactive
      dockerfile: Dockerfile.native-profile
    image: beauty-salon-reactive:native
    container_name: beauty-salon-api-native
    hostname: api-native
    ports:
      - "8086:8085"  # Different port to avoid conflict with JVM
    environment:
      # Spring Boot Configuration
      - SPRING_PROFILES_ACTIVE=docker
      
      # Cassandra Configuration
      - SPRING_DATA_CASSANDRA_CONTACT_POINTS=cassandra
      - SPRING_DATA_CASSANDRA_PORT=9042
      - SPRING_DATA_CASSANDRA_KEYSPACE_NAME=beauty_salon
      - SPRING_DATA_CASSANDRA_LOCAL_DATACENTER=datacenter1
      - SPRING_DATA_CASSANDRA_SCHEMA_ACTION=CREATE_IF_NOT_EXISTS
      
      # Server Configuration
      - SERVER_PORT=8085
      - SERVER_COMPRESSION_ENABLED=true
      
      # Logging
      - LOGGING_LEVEL_ROOT=INFO
      - LOGGING_LEVEL_COM_BEAUTYSALON=DEBUG
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - beauty-salon-profiles
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    profiles:
      - native

  # Java Reactive Backend - Both Profiles (for comparison)
  api-jvm-compare:
    build:
      context: ./backend/java-reactive
      dockerfile: Dockerfile.jvm
    image: beauty-salon-reactive:jvm
    container_name: beauty-salon-api-jvm-compare
    hostname: api-jvm-compare
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_CASSANDRA_CONTACT_POINTS=cassandra
      - SPRING_DATA_CASSANDRA_PORT=9042
      - SPRING_DATA_CASSANDRA_KEYSPACE_NAME=beauty_salon
      - SPRING_DATA_CASSANDRA_LOCAL_DATACENTER=datacenter1
      - SPRING_DATA_CASSANDRA_SCHEMA_ACTION=CREATE_IF_NOT_EXISTS
      - SERVER_PORT=8085
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseG1GC
      - LOGGING_LEVEL_ROOT=INFO
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - beauty-salon-profiles
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    profiles:
      - compare

  api-native-compare:
    build:
      context: ./backend/java-reactive
      dockerfile: Dockerfile.native-profile
    image: beauty-salon-reactive:native
    container_name: beauty-salon-api-native-compare
    hostname: api-native-compare
    ports:
      - "8086:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_CASSANDRA_CONTACT_POINTS=cassandra
      - SPRING_DATA_CASSANDRA_PORT=9042
      - SPRING_DATA_CASSANDRA_KEYSPACE_NAME=beauty_salon
      - SPRING_DATA_CASSANDRA_LOCAL_DATACENTER=datacenter1
      - SPRING_DATA_CASSANDRA_SCHEMA_ACTION=CREATE_IF_NOT_EXISTS
      - SERVER_PORT=8085
      - LOGGING_LEVEL_ROOT=INFO
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - beauty-salon-profiles
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    profiles:
      - compare

volumes:
  cassandra_data_profiles:
    driver: local
    name: beauty_salon_cassandra_profiles

networks:
  beauty-salon-profiles:
    driver: bridge
    name: beauty_salon_profiles_network
    ipam:
      driver: default
      config:
        - subnet: 172.26.0.0/16
          gateway: 172.26.0.1
