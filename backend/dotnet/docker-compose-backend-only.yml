name: beauty-salon-dotnet-backend-only

services:
  cassandra:
    image: cassandra:4.1
    container_name: beauty-salon-cassandra-dotnet-test
    ports:
      - "9044:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=BeautySalonCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    volumes:
      - cassandra_data_dotnet_test:/var/lib/cassandra
    networks:
      - beauty-salon-dotnet-test
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend-dotnet:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beauty-salon-backend-dotnet-test
    ports:
      - "10002:10002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:10002
      - Cassandra__ContactPoints=cassandra
      - Cassandra__Port=9042
      - Cassandra__Keyspace=beauty_salon
      - Cassandra__LocalDatacenter=datacenter1
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - beauty-salon-dotnet-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  cassandra_data_dotnet_test:

networks:
  beauty-salon-dotnet-test:
    driver: bridge
