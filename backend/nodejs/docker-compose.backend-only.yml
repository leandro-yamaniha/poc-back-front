version: '3.8'

name: beauty-salon-nodejs

services:
  cassandra:
    image: cassandra:4.1
    container_name: beauty-salon-cassandra-nodejs
    ports:
      - "9046:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=BeautySalonCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    volumes:
      - cassandra_data_nodejs:/var/lib/cassandra
    networks:
      - beauty-salon-nodejs
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  backend-nodejs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beauty-salon-backend-nodejs
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CASSANDRA_CONTACT_POINTS=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=beauty_salon
      - CASSANDRA_LOCAL_DATACENTER=datacenter1
      - NODE_OPTIONS=--max-old-space-size=512
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - beauty-salon-nodejs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 135M
          cpus: '1.0'
        reservations:
          memory: 70M
          cpus: '0.5'

volumes:
  cassandra_data_nodejs:
    driver: local

networks:
  beauty-salon-nodejs:
    driver: bridge
