server:
  port: 10006
  undertow:
    threads:
      io: 16
      worker: 256
    buffer-size: 1024
    direct-buffers: true

spring:
  application:
    name: beauty-salon-reactive
  
  cassandra:
    keyspace-name: beauty_salon
    contact-points: localhost
    port: 9042
    local-datacenter: datacenter1
    schema-action: create-if-not-exists
    request:
      timeout: 10s
      consistency: local-quorum
    connection:
      connect-timeout: 10s
      init-query-timeout: 10s

  webflux:
    # Removed base-path to avoid conflicts with SpringDoc

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  health:
    cassandra:
      enabled: true

logging:
  level:
    root: INFO
    com.beautysalon.reactive: DEBUG
    com.beautysalon.reactive.controller: INFO
    com.beautysalon.reactive.service: INFO
    com.beautysalon.reactive.repository: DEBUG
    com.beautysalon.reactive.exception: WARN
    org.springframework.data.cassandra: INFO
    org.springframework.web.reactive: INFO
    reactor.netty: INFO
    reactor.core: INFO
    io.undertow: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{40} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{40} - %msg%n"
  file:
    name: logs/beauty-salon-reactive.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 1GB
  logback:
    rollingpolicy:
      file-name-pattern: logs/beauty-salon-reactive.%d{yyyy-MM-dd}.%i.log
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 1GB
