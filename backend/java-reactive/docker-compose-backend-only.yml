version: '3.8'

name: beauty-salon-reactive-backend-only

services:
  cassandra:
    image: cassandra:4.1
    container_name: beauty-salon-cassandra-reactive-test
    ports:
      - "9049:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=BeautySalonCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    volumes:
      - cassandra_data_reactive_test:/var/lib/cassandra
    networks:
      - beauty-salon-reactive-test
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend-java-reactive:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beauty-salon-backend-reactive-test
    ports:
      - "10006:10006"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=10006
      - SPRING_CASSANDRA_CONTACT_POINTS=cassandra
      - SPRING_CASSANDRA_PORT=9042
      - SPRING_CASSANDRA_KEYSPACE_NAME=beauty_salon
      - SPRING_CASSANDRA_LOCAL_DATACENTER=datacenter1
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - beauty-salon-reactive-test
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:10006/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  cassandra_data_reactive_test:

networks:
  beauty-salon-reactive-test:
    driver: bridge
