name: beauty-salon-java-backend-only

services:
  cassandra:
    image: cassandra:4.1
    container_name: beauty-salon-cassandra-java-test
    ports:
      - "9043:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=BeautySalonCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    volumes:
      - cassandra_data_java_test:/var/lib/cassandra
    networks:
      - beauty-salon-java-test
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend-java:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beauty-salon-backend-java-test
    ports:
      - "10001:10001"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=10001
      - CASSANDRA_CONTACT_POINTS=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=beauty_salon
      - JAVA_OPTS=-Xmx1g -Xms512m
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=0.0
      - MANAGEMENT_ZIPKIN_TRACING_ENABLED=false
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - beauty-salon-java-test
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:10001/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  cassandra_data_java_test:

networks:
  beauty-salon-java-test:
    driver: bridge
