version: '3.8'

services:
  cassandra:
    image: cassandra:4.1
    container_name: beauty-salon-cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - beauty-salon-net
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beauty-salon-backend
    ports:
      - "10001:10001"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=10001
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - beauty-salon-net

volumes:
  cassandra_data:

networks:
  beauty-salon-net:
