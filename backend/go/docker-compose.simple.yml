version: '3.8'

name: beauty-salon-go

services:
  cassandra:
    image: cassandra:4.1
    container_name: beauty-salon-cassandra-go
    ports:
      - "9046:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=BeautySalonCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    volumes:
      - cassandra_data_go:/var/lib/cassandra
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - beauty-salon-go
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  backend-go:
    image: alpine:3.19
    container_name: beauty-salon-backend-go
    ports:
      - "${PORT:-8082}:${PORT:-8082}"
    environment:
      - PORT=${PORT:-8082}
      - SERVER_HOST=0.0.0.0
      - CASSANDRA_HOSTS=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=beauty_salon
      - CASSANDRA_DATACENTER=datacenter1
    volumes:
      - ./beauty-salon:/app/beauty-salon:ro
    working_dir: /app
    command: ./beauty-salon
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - beauty-salon-go
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${PORT:-8082}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.25'

volumes:
  cassandra_data_go:
    driver: local

networks:
  beauty-salon-go:
    driver: bridge
