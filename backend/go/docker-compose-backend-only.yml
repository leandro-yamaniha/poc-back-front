name: beauty-salon-go-backend-only

services:
  cassandra:
    image: cassandra:4.1
    container_name: beauty-salon-cassandra-go-test
    ports:
      - "9047:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=BeautySalonCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    volumes:
      - cassandra_data_go_test:/var/lib/cassandra
    networks:
      - beauty-salon-go-test
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend-go:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beauty-salon-backend-go-test
    ports:
      - "10005:10005"
    environment:
      - SERVER_PORT=10005
      - SERVER_HOST=0.0.0.0
      - CASSANDRA_HOSTS=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=beauty_salon
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - beauty-salon-go-test
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:10005/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  cassandra_data_go_test:

networks:
  beauty-salon-go-test:
    driver: bridge
