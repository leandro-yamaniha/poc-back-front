version: '3.8'

name: beauty-salon-python-react

services:
  cassandra:
    image: cassandra:4.1
    container_name: beauty-salon-cassandra-python
    ports:
      - "9045:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=BeautySalonCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    volumes:
      - cassandra_data_python:/var/lib/cassandra
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - beauty-salon-python
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend-python:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beauty-salon-backend-python
    ports:
      - "${BACKEND_HOST_PORT:-10003}:10003"
    environment:
      - CASSANDRA_HOSTS=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=beauty_salon
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - beauty-salon-python
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:10003/api/customers || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:${BACKEND_HOST_PORT:-10003}/api}
    container_name: beauty-salon-frontend-python
    ports:
      - "${FRONTEND_HOST_PORT:-3003}:3000"
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:${BACKEND_HOST_PORT:-10003}/api}
      - REACT_APP_BACKEND_TYPE=python
    depends_on:
      backend-python:
        condition: service_healthy
    networks:
      - beauty-salon-python

volumes:
  cassandra_data_python:

networks:
  beauty-salon-python:
    driver: bridge
