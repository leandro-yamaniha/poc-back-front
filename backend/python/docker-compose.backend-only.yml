version: '3.8'

name: beauty-salon-python

services:
  cassandra:
    image: cassandra:4.1
    container_name: beauty-salon-cassandra-python
    ports:
      - "9045:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=BeautySalonCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    volumes:
      - cassandra_data_python:/var/lib/cassandra
    networks:
      - beauty-salon-python
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  backend-python:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: beauty-salon-backend-python
    ports:
      - "8000:10003"
    environment:
      - CASSANDRA_HOSTS=cassandra
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=beauty_salon
      - CASSANDRA_LOCAL_DATACENTER=datacenter1
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - beauty-salon-python
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:10003/api/customers || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 135M
          cpus: '0.5'
        reservations:
          memory: 70M
          cpus: '0.25'

volumes:
  cassandra_data_python:
    driver: local

networks:
  beauty-salon-python:
    driver: bridge
